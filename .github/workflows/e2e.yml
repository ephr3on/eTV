name: Athan rehearsal

# The athan on an Android emulator, with a stand-in film playing: does the film stop, does
# nothing but the code get out of the athan, and does the film carry on with its sound afterwards?
# Runs for branches named e2e*, and by hand; the report goes to the branch e2e-out.
on:
  push:
    branches: ['e2e', 'e2e-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build eTV and the stand-in film app
        env:
          ETV_E2E: '1'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :fakeplayer:assembleDebug

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rehearse the athan
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QEMU_AUDIO_DRV: none
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 29 && 'default' || 'google_apis' }}
          profile: pixel_6
          disable-animations: true
          # Not -no-audio: the emulator needs its sound card for the film and the athan to play.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash scripts/athan-e2e.sh out/api${{ matrix.api }} || touch out/api${{ matrix.api }}/FAILED

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api${{ matrix.api }}
          path: out

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=out/api${{ matrix.api }}
          mkdir -p "$D"
          cd "$D"
          git init -q
          git checkout -q -b e2e-out-api${{ matrix.api }}
          git add -A
          git -c user.name=eTV-ci -c user.email=ci@users.noreply.github.com commit -qm "Rehearsal for $GITHUB_SHA" || true
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" e2e-out-api${{ matrix.api }}
